<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Games Store - Khang Golden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Thư viện đọc file CSV nhanh chóng -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        .poster-aspect { aspect-ratio: 2 / 3; }
        .card-hover-glow:hover { box-shadow: 0 0 20px rgba(139, 92, 246, 0.35); transform: translateY(-4px); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-violet-600 selection:text-white">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-gray-950/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="#" onclick="filterType('ALL'); return false;" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-violet-600 flex items-center justify-center text-white text-xl">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div>
                    <span class="font-extrabold text-lg text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-cyan-400">KHANG GOLDEN</span>
                    <span class="block text-[10px] text-gray-400 tracking-widest uppercase">GAMES STORE</span>
                </div>
            </a>
            <div class="flex items-center gap-2">
                <button onclick="filterType('ALL')" id="nav-ALL" class="px-4 py-2 rounded-xl text-sm font-semibold bg-violet-600 text-white transition-all">Tất Cả</button>
                <button onclick="filterType('OFFLINE')" id="nav-OFFLINE" class="px-4 py-2 rounded-xl text-sm font-semibold text-gray-300 hover:bg-gray-800 transition-all">Offline</button>
                <button onclick="filterType('ONLINE')" id="nav-ONLINE" class="px-4 py-2 rounded-xl text-sm font-semibold text-gray-300 hover:bg-gray-800 transition-all">Online</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-800">
            <h2 class="text-xl font-bold text-white">Danh Sách Kho Game Khang Golden</h2>
            <span id="gameCountBadge" class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-800 text-gray-400">0 Game</span>
        </div>

        <div id="gameGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div class="col-span-full text-center py-20 text-amber-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
                <p class="font-bold">Đang tải danh sách game từ file CSV...</p>
            </div>
        </div>
    </main>

    <!-- MODAL -->
    <div id="gameModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="relative w-full max-w-lg bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 id="modalTitle" class="text-xl font-bold text-white">Tên Game</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p id="modalSize" class="text-xs text-amber-400 font-semibold">Dung lượng: --</p>
            <p id="modalStatus" class="text-xs text-gray-400">Trạng thái: --</p>
            <a id="modalDownloadBtn" href="#" target="_blank" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold text-center block shadow-lg hover:opacity-90 transition-opacity">
                <i class="fa-solid fa-download mr-2"></i> TẢI NGAY TỐC ĐỘ CAO
            </a>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        let ALL_GAMES = [];
        let currentFilter = 'ALL';

        // Đọc đồng thời 2 file CSV (Offline và Online)
        async function loadAllCSVData() {
            try {
                const [offlineData, onlineData] = await Promise.all([
                    fetchCSV('GAME OFFLINE.csv', 'OFFLINE'),
                    fetchCSV('GAME ONLINE.csv', 'ONLINE')
                ]);

                ALL_GAMES = [...offlineData, ...onlineData];
                renderGames();
            } catch (error) {
                console.error("Lỗi tải file CSV:", error);
                document.getElementById('gameGrid').innerHTML = '<div class="col-span-full text-center py-10 text-red-400">Không tìm thấy file CSV! Hãy chắc chắn workflow GitHub Actions đã chạy thành công.</div>';
            }
        }

        function fetchCSV(filePath, typeTag) {
            return new Promise((resolve) => {
                Papa.parse(filePath, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        const formatted = results.data.map((item, index) => {
                            // Tự động tìm các cột phổ biến trong Notion tương ứng
                            const name = item.Title || item.Name || item.Tên || Object.values(item)[0] || "Game Chưa Đặt Tên";
                            const size = item["Dung Lượng"] || item.Size || "N/A";
                            const status = item.Status || item.Trạng_thái || "Success";
                            const image = item.Image || item.Hình_ảnh || "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800";
                            const link = item.Link || item.URL || "#";

                            return {
                                id: `${typeTag}-${index}`,
                                name: name,
                                type: typeTag,
                                size: size.includes('GB') ? size : (size ? size + ' GB' : 'N/A'),
                                status: status,
                                image: image,
                                link: link
                            };
                        });
                        resolve(formatted);
                    },
                    error: function(err) {
                        console.warn(`Không đọc được file ${filePath}:`, err);
                        resolve([]);
                    }
                });
            });
        }

        window.onload = function() {
            loadAllCSVData();
        };

        function filterType(type) {
            currentFilter = type;
            
            // Đổi màu style nút bấm menu
            ['ALL', 'OFFLINE', 'ONLINE'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if(t === type) {
                    btn.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-violet-600 text-white transition-all";
                } else {
                    btn.className = "px-4 py-2 rounded-xl text-sm font-semibold text-gray-300 hover:bg-gray-800 transition-all";
                }
            });

            renderGames();
        }

        function renderGames() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';

            const filtered = ALL_GAMES.filter(g => currentFilter === 'ALL' || g.type === currentFilter);
            document.getElementById('gameCountBadge').innerText = `${filtered.length} Game`;

            if(filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">Chưa có game nào trong mục này!</div>';
                return;
            }

            filtered.forEach(game => {
                const badgeColor = game.type === 'OFFLINE' ? 'bg-amber-600' : 'bg-cyan-600';
                grid.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-lg card-hover-glow flex flex-col cursor-pointer" onclick="openModal('${game.id}')">
                        <div class="relative w-full poster-aspect bg-gray-950 overflow-hidden">
                            <img src="${game.image}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800'">
                            <span class="absolute top-2 left-2 px-2 py-0.5 rounded text-[10px] font-bold ${badgeColor} text-white">${game.type}</span>
                            <span class="absolute top-2 right-2 px-2 py-0.5 rounded text-[10px] font-bold bg-black/70 text-amber-300">${game.size}</span>
                        </div>
                        <div class="p-3 flex flex-col justify-between flex-grow">
                            <h3 class="font-bold text-sm text-gray-100 line-clamp-1">${game.name}</h3>
                            <button class="mt-2 w-full py-1.5 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold transition-colors">
                                <i class="fa-solid fa-download mr-1"></i> Tải ngay
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(id) {
            const game = ALL_GAMES.find(g => g.id === id);
            if(!game) return;
            document.getElementById('modalTitle').innerText = game.name;
            document.getElementById('modalSize').innerText = `Dung lượng: ${game.size}`;
            document.getElementById('modalStatus').innerText = `Trạng thái: ${game.status}`;
            document.getElementById('modalDownloadBtn').href = game.link;
            document.getElementById('gameModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('gameModal').classList.add('hidden');
        }
    </script>
</body>
</html>
