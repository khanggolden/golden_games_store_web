<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Games Store - Khang Golden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        .poster-aspect { aspect-ratio: 2 / 3; }
        .card-hover-glow:hover { box-shadow: 0 0 20px rgba(139, 92, 246, 0.35); transform: translateY(-4px); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-violet-600 selection:text-white">
    <header class="sticky top-0 z-40 bg-gray-950/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="font-extrabold text-lg text-amber-400">KHANG GOLDEN GAMES STORE</span>
            <div class="flex gap-2">
                <button onclick="filterType('ALL')" class="px-3 py-1.5 rounded-lg bg-violet-600 text-white text-xs font-semibold">Tất cả</button>
                <button onclick="filterType('OFFLINE')" class="px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 text-xs font-semibold">Offline</button>
                <button onclick="filterType('ONLINE')" class="px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 text-xs font-semibold">Online</button>
            </div>
        </div>
    </header>
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div id="gameGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div class="col-span-full text-center py-20 text-amber-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p>Đang tải danh sách game...</p></div>
        </div>
    </main>
    <script>
        let GAMES = [];
        let currentFilter = 'ALL';

        async function loadGames() {
            try {
                // Tải file games.json tự động cập nhật từ GitHub
                const res = await fetch('games.json?' + new Date().getTime());
                GAMES = await res.json();
                renderGames();
            } catch (e) {
                console.error(e);
            }
        }

        function filterType(type) {
            currentFilter = type;
            renderGames();
        }

        function renderGames() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            const filtered = GAMES.filter(g => currentFilter === 'ALL' || g.type === currentFilter);
            
            filtered.forEach(game => {
                grid.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-lg card-hover-glow flex flex-col">
                        <div class="relative w-full poster-aspect bg-gray-950 overflow-hidden">
                            <img src="${game.image}" class="w-full h-full object-cover">
                            <span class="absolute top-2 left-2 px-2 py-0.5 rounded text-[10px] font-bold ${game.type === 'ONLINE' ? 'bg-cyan-600' : 'bg-amber-600'} text-white">${game.type}</span>
                            <span class="absolute top-2 right-2 px-2 py-0.5 rounded text-[10px] font-bold bg-black/70 text-amber-300">${game.size}</span>
                        </div>
                        <div class="p-3 flex flex-col justify-between flex-grow">
                            <h3 class="font-bold text-sm text-gray-100 line-clamp-1">${game.name}</h3>
                            <a href="${game.link}" target="_blank" class="mt-2 w-full py-1.5 rounded bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold text-center block">
                                <i class="fa-solid fa-download mr-1"></i> Tải ngay
                            </a>
                        </div>
                    </div>
                `;
            });
        }
        window.onload = loadGames;
    </script>
</body>
</html>
