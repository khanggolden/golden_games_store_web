<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khang Golden - Golden Games Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Thư viện đọc file CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d111d; color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0d111d; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .card-aspect { aspect-ratio: 16 / 9; }
        .card-hover { transition: all 0.25s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-violet-600 selection:text-white">

    <!-- HEADER / NAVBAR -->
    <header class="sticky top-0 z-50 bg-[#090d16]/95 backdrop-blur-md border-b border-gray-800/60">
        <div class="max-w-[1440px] mx-auto px-4 lg:px-8 h-16 flex items-center justify-between gap-6">
            <a href="#" onclick="filterType('ALL'); return false;" class="flex items-center gap-2.5 shrink-0">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-violet-600 flex items-center justify-center text-white text-lg shadow-md">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div>
                    <span class="font-black text-lg tracking-tight text-white">KHANG GOLDEN</span>
                    <span class="block text-[9px] text-gray-400 tracking-widest uppercase font-semibold">Games Store</span>
                </div>
            </a>

            <!-- SEARCH BAR -->
            <div class="flex-grow max-w-sm hidden md:block">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400 text-xs">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Tìm kiếm tựa game..." class="w-full pl-9 pr-4 py-1.5 bg-[#141a29] border border-gray-800 rounded-lg text-xs text-white focus:outline-none focus:border-violet-500 transition-colors">
                </div>
            </div>

            <!-- NAVIGATION -->
            <div class="flex items-center gap-5 text-xs font-semibold text-gray-300">
                <a href="#" onclick="filterType('ALL'); return false;" class="hover:text-white transition-colors">Tất Cả</a>
                <a href="#" onclick="filterType('OFFLINE'); return false;" class="hover:text-white transition-colors">Game Offline</a>
                <a href="#" onclick="filterType('ONLINE'); return false;" class="hover:text-white transition-colors">Game Online</a>
                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500 text-black uppercase">2026</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow max-w-[1440px] mx-auto px-4 lg:px-8 py-8 w-full space-y-10">

        <!-- SEARCH MOBILE -->
        <div class="md:hidden">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400 text-xs">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInputMobile" oninput="handleSearchMobile()" placeholder="Tìm kiếm tựa game..." class="w-full pl-9 pr-4 py-2 bg-[#141a29] border border-gray-800 rounded-lg text-xs text-white focus:outline-none">
            </div>
        </div>

        <!-- ROW 1: GAME OFFLINE MỚI -->
        <section class="flex flex-col lg:flex-row gap-6 items-start">
            <div class="w-full lg:w-48 shrink-0 pt-2 space-y-2">
                <h2 class="text-2xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500">
                    Game Offline<br>Mới
                </h2>
                <a href="#" onclick="filterType('OFFLINE'); return false;" class="text-xs text-gray-400 hover:text-amber-400 font-medium inline-flex items-center gap-1 transition-colors">
                    Xem toàn bộ <i class="fa-solid fa-angle-right text-[10px]"></i>
                </a>
            </div>

            <div class="relative flex-grow w-full overflow-hidden group">
                <button onclick="scrollRow('offlineRow', -300)" class="absolute left-0 top-1/2 -translate-y-1/2 z-10 w-9 h-9 rounded-full bg-black/70 text-white opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center hover:bg-violet-600">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <div id="offlineRow" class="flex gap-4 overflow-x-auto no-scrollbar scroll-smooth py-2">
                    <div class="text-xs text-gray-500 py-10">Đang tải danh sách game offline...</div>
                </div>
                <button onclick="scrollRow('offlineRow', 300)" class="absolute right-0 top-1/2 -translate-y-1/2 z-10 w-9 h-9 rounded-full bg-black/70 text-white opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center hover:bg-violet-600">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>
        </section>

        <!-- ROW 2: GAME ONLINE MỚI -->
        <section class="flex flex-col lg:flex-row gap-6 items-start">
            <div class="w-full lg:w-48 shrink-0 pt-2 space-y-2">
                <h2 class="text-2xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
                    Game Online<br>Mới
                </h2>
                <a href="#" onclick="filterType('ONLINE'); return false;" class="text-xs text-gray-400 hover:text-pink-400 font-medium inline-flex items-center gap-1 transition-colors">
                    Xem toàn bộ <i class="fa-solid fa-angle-right text-[10px]"></i>
                </a>
            </div>

            <div class="relative flex-grow w-full overflow-hidden group">
                <button onclick="scrollRow('onlineRow', -300)" class="absolute left-0 top-1/2 -translate-y-1/2 z-10 w-9 h-9 rounded-full bg-black/70 text-white opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center hover:bg-violet-600">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <div id="onlineRow" class="flex gap-4 overflow-x-auto no-scrollbar scroll-smooth py-2">
                    <div class="text-xs text-gray-500 py-10">Đang tải danh sách game online...</div>
                </div>
                <button onclick="scrollRow('onlineRow', 300)" class="absolute right-0 top-1/2 -translate-y-1/2 z-10 w-9 h-9 rounded-full bg-black/70 text-white opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center hover:bg-violet-600">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>
        </section>

        <!-- TOP BÌNH LUẬN -->
        <section class="bg-[#121826] border border-gray-800/80 rounded-2xl p-6 space-y-4">
            <div class="flex items-center gap-2 text-amber-400 font-bold text-sm">
                <i class="fa-solid fa-comments"></i>
                <span>TOP BÌNH LUẬN</span>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                <div class="bg-[#1a2133] p-3 rounded-xl border border-gray-800 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-500 flex items-center justify-center text-white text-xs font-bold shrink-0">K</div>
                        <div class="overflow-hidden">
                            <p class="text-xs font-bold text-white truncate">Khang Golden <span class="text-[10px] text-amber-400">OO</span></p>
                            <p class="text-[11px] text-gray-400 truncate
